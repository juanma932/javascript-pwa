<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <title>Intro a PWA</title>
</head>

<body>
  <!-- Layout principal -->
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="bg-indigo-700 text-white w-64 flex flex-col">
      <div class="px-6 py-4 text-2xl font-semibold border-b border-indigo-600">
        Servicios
      </div>
      <nav class="flex-1 px-4 py-4 space-y-2">
        <a href="" class="block px-3 py-2 rounded hover:bg-indigo-600">Servicio 1</a>
        <a href="" class="block px-3 py-2 rounded hover:bg-indigo-600">Servicio 2</a>
        <a href="" class="block px-3 py-2 rounded hover:bg-indigo-600">Servicio 3</a>
        <a href="" class="block px-3 py-2 rounded hover:bg-indigo-600">Servicio 4</a>
      </nav>
    </aside>

    <!-- Contenido principal  Main content-->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="bg-indigo-600 text-white flex item-center justify-between px-6 py-3 shadow-md">
        <h1 class="text-xl font-semibold">Super lista productos</h1>
      </header>
      <!-- Contenido -->
      <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl mx-auto space-y-5">
          <!--  Controles de entrada -->
          <div class="flex-wrap items-center gap-4">
            <div class="flex1">
              <label for="ingreso-producto" class="block text-sm font-medium text-gray-700">Ingrese producto</label>
              <input type="text" id="ingreso-producto"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm outline-none focus:border-indigo-500 focus:ring-indigo-500"
                placeholder="Nombre del producto" />
            </div>
          </div>
          <!-- Boton agregar -->
          <button id="btn-entrada-producto"
            class="flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white rounded-full h-12 shadow-md transition w-15 ">
            <span class="material-symbols-outlined">
              add_shopping_cart
            </span>
          </button>

          <!-- Boton borrar -->
          <button id="btn-borrar-productos"
            class="bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-md shadow-md trasition w-30">Borrar

          </button>

          <!-- Lista de productos -->
          <div id="lista" class="mt-6 space-y-2">
            <ul>

            </ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
